<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проверка пароля</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            padding: 50px;
        }

        .container {
            max-width: 400px;
            margin: auto;
            padding: 25px;
            background-color: white;
            border-radius: 10px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        .valid {
            color: green;
        }

        .invalid {
            color: red;
        }

        #result {
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Проверка пароля</h1>

        <label for="password">Введите пароль:</label>

        <input
            type="password"
            id="password"
            placeholder="Введите пароль"
        >

        <h3>Требования:</h3>

        <p id="length" class="invalid">
            ✗ Не менее 8 символов
        </p>

        <p id="digit" class="invalid">
            ✗ Хотя бы одна цифра
        </p>

        <p id="result">
            Введите пароль для проверки.
        </p>
    </div>

    <script src="script.js"></script>
</body>
</html>
