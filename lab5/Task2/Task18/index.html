<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Электронный журнал</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            padding: 30px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #dce6f1;
        }

        button {
            padding: 10px 15px;
            margin-top: 15px;
            cursor: pointer;
        }

        #groupAverage {
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Электронный журнал</h1>

        <button id="sortBtn">
            Сортировать по среднему баллу
        </button>

        <table>
            <thead>
                <tr>
                    <th>№</th>
                    <th>Имя студента</th>
                    <th>Оценки</th>
                    <th>Средний балл</th>
                </tr>
            </thead>

            <tbody id="journalBody"></tbody>
        </table>

        <p id="groupAverage"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
