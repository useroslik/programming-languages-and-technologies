<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Задание 18 - Файловый менеджер</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="file-manager">
        <h2>Файловый менеджер</h2>
        <div class="controls">
            <input type="text" id="itemNameInput" placeholder="Имя папки/файла...">
            <button id="addFolderBtn">Добавить папку</button>
            <button id="addFileBtn">Добавить файл</button>
            <button id="renameBtn">Переименовать</button>
            <button id="deleteBtn">Удалить</button>
        </div>
        <ul id="fileList" class="file-list"></ul>
    </div>
    <script src="script.js"></script>
</body>
</html>
