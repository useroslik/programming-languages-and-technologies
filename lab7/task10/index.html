<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список задач — SPA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Менеджер задач</h1>
        <nav>
            <button class="nav-btn active" data-filter="all">Все</button>
            <button class="nav-btn" data-filter="active">Активные</button>
            <button class="nav-btn" data-filter="completed">Выполненные</button>
        </nav>
    </header>
    <main id="content" aria-live="polite">
        <div class="task-form">
            <input type="text" id="taskInput" placeholder="Новая задача...">
            <button id="addTaskBtn">Добавить</button>
        </div>
        <ul id="taskList"></ul>
    </main>
    <script src="app.js" defer></script>
</body>
</html>
