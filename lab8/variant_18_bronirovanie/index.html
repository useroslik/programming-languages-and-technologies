<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вариант 18 — Бронирование учебных комнат</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script>
</head>
<body><main class="container">
  <header><p class="eyebrow">Лабораторная работа № 8 · Вариант 18</p><h1>Бронирование учебных комнат</h1><p>Выбери дату, время и помещение. Система не позволит создать бронь с совпадающими датой, временем и комнатой.</p></header>
  <section class="panel"><form id="bookingForm">
    <label for="bookingDate">Дата</label><input id="bookingDate" type="date" required>
    <label for="bookingTime">Время начала</label><select id="bookingTime" required>
      <option value="">Выберите время</option><option>09:00</option><option>10:00</option><option>11:00</option><option>12:00</option><option>13:00</option><option>14:00</option><option>15:00</option><option>16:00</option><option>17:00</option>
    </select>
    <label for="room">Помещение</label><select id="room" required><option value="">Выберите помещение</option><option>Аудитория 101</option><option>Аудитория 202</option><option>Компьютерный класс 305</option><option>Переговорная 12</option></select>
    <label for="purpose">Цель бронирования (необязательно)</label><input id="purpose" maxlength="100" placeholder="Например, подготовка к проекту">
    <button type="submit">Забронировать</button>
  </form><p id="message" class="message" role="status"></p></section>
  <section class="panel"><div class="section-title"><h2>Список бронирований</h2><span id="count" class="count">0</span></div><div id="bookings"></div></section>
  <footer>Брони сохраняются в localStorage в формате JSON.</footer>
</main></body></html>
